[package]
name = "audeep"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["xtask"]

[dependencies]
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
dns-lookup = "2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
mdns-sd = "0.11"
clap = { version = "4.5", features = ["derive"] }
